name: Build LARYVAS V3.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - desenvolvimento-v3
      - validacao-v3-integrada
      - validacao-v3.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js para validar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxe e testes de compatibilidade
        run: |
          node --check app/src/main/assets/script.js
          node --test tests/data-compatibility.test.cjs

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar e validar chave de assinatura privada
        env:
          KEYSTORE_BASE64: ${{ secrets.LARYVAS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LARYVAS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LARYVAS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LARYVAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Secret de assinatura ausente: $name" >&2
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laryvas-release.jks"
          test -s "$RUNNER_TEMP/laryvas-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/laryvas-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Compilar APK V3.1 assinado
        env:
          LARYVAS_KEYSTORE_PATH: ${{ runner.temp }}/laryvas-release.jks
          LARYVAS_STORE_PASSWORD: ${{ secrets.LARYVAS_STORE_PASSWORD }}
          LARYVAS_KEY_ALIAS: ${{ secrets.LARYVAS_KEY_ALIAS }}
          LARYVAS_KEY_PASSWORD: ${{ secrets.LARYVAS_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: LARYVAS-V3.1-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
