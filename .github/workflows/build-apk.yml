name: Build LARYVAS V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - desenvolvimento-v3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar chave de assinatura privada
        env:
          KEYSTORE_BASE64: ${{ secrets.LARYVAS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret LARYVAS_KEYSTORE_BASE64 não configurado" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laryvas-release.jks"
          test -s "$RUNNER_TEMP/laryvas-release.jks"

      - name: Compilar APK V3 assinado
        env:
          LARYVAS_KEYSTORE_PATH: ${{ runner.temp }}/laryvas-release.jks
          LARYVAS_STORE_PASSWORD: ${{ secrets.LARYVAS_STORE_PASSWORD }}
          LARYVAS_KEY_ALIAS: ${{ secrets.LARYVAS_KEY_ALIAS }}
          LARYVAS_KEY_PASSWORD: ${{ secrets.LARYVAS_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: LARYVAS-V3-release-apk
          path: app/build/outputs/apk/release/app-release.apk
