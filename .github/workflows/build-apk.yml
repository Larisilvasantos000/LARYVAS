name: Build LARYVAS APK

on:
  workflow_dispatch:
  push:
    branches: [ Apk-v8 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências do Capacitor
        run: npm install

      - name: Criar pasta android se ainda não existir
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar arquivos web com o projeto Android
        run: npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Enviar APK para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LARYVAS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
