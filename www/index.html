<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LARYVAS — Sua biblioteca pessoal</title>
  <style>
    :root {
      --bg-page: #0f0c18;
      --bg-card: #1a1528;
      --bg-card-hover: #231c36;
      --bg-pill: #1b1629;
      --bg-input: #120e1d;
      --border: #2e2645;
      --purple: #7c3aed;
      --purple-light: #9333ea;
      --purple-glow: rgba(124, 58, 237, 0.35);
      --text-main: #f4f1fa;
      --text-muted: #988eb0;
      --green: #10b981;
      --amber: #f59e0b;
      --violet-num: #a855f7;
      --danger: #ef4444;
      --colunas-obras: 3;
    }

    body.theme-light {
      --bg-page: #f5f3fa;
      --bg-card: #ffffff;
      --bg-card-hover: #f0ebf9;
      --bg-pill: #efeaf8;
      --bg-input: #f7f5fc;
      --border: #ddd4ef;
      --text-main: #1b1529;
      --text-muted: #5d5375;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 104px;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* Topo */
    .topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-brand {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      min-width: 0;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-subtitle {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .icon-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--purple);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    /* Aviso discreto de backup */
    .backup-banner {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--amber);
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .backup-banner.ok {
      border-left-color: var(--green);
    }

    .backup-banner-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 4 Cards de estatísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .stat-card:hover,
    .stat-card.active {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .stat-total { color: var(--text-main); }
    .stat-lendo { color: var(--violet-num); }
    .stat-concluidas { color: var(--green); }
    .stat-favoritas { color: var(--amber); }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Barra de busca */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box input:focus {
      border-color: var(--purple);
    }

    /* Linha de Categorias */
    .cat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cat-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: none;
      padding: 2px 0;
    }

    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .cat-pill .badge {
      background: var(--bg-card-hover);
      color: var(--text-main);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px var(--purple-glow);
    }

    .cat-pill.active .badge {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .btn-add-cat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-add-cat:hover {
      border-color: var(--purple);
    }

    .swipe-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 6px;
      margin-bottom: 10px;
    }

    /* Pílulas de Status */
    .status-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 12px;
      padding-bottom: 2px;
    }

    .status-scroll::-webkit-scrollbar {
      display: none;
    }

    .status-pill {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .status-pill.active {
      background: var(--bg-card-hover);
      border-color: var(--purple);
      color: var(--text-main);
      box-shadow: 0 0 0 1px var(--purple-glow);
    }

    /* Ordenar e Limpar filtros */
    .sort-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .sort-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .btn-clear-filters {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .btn-clear-filters.visible {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12.5px;
      outline: none;
      cursor: pointer;
    }

    /* Empty State */
    .empty-state {
      border: 1.5px dashed var(--border);
      border-radius: 22px;
      padding: 46px 20px;
      text-align: center;
      background: var(--bg-card);
      margin-top: 4px;
    }

    .empty-icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: var(--bg-pill);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    .empty-text {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .empty-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--purple-glow);
    }

    .btn-secondary {
      background: var(--bg-pill);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    .btn-danger-outline {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    body.theme-light .btn-danger-outline {
      color: #b91c1c;
    }

    /* Grade de Obras */
    .obras-grid {
      display: grid;
      grid-template-columns: repeat(var(--colunas-obras, 3), minmax(0, 1fr));
      gap: 10px;
    }

    .obra-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      transition: border-color 0.15s, transform 0.15s;
    }

    .obra-card.selected {
      border-color: var(--purple);
      box-shadow: 0 0 0 2px var(--purple-glow);
    }

    .obra-select-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--purple);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      display: none;
      place-items: center;
    }

    .selection-mode .obra-select-badge {
      display: grid;
    }

    .selection-mode .obra-status-tag {
      left: 38px;
    }

    .obra-cover-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--bg-pill);
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .obra-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .obra-cover-placeholder {
      font-size: 32px;
      opacity: 0.7;
    }

    .obra-status-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 12, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f4f1fa;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      max-width: 72%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .obra-fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 12, 24, 0.85);
      color: var(--amber);
      font-size: 13px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .obra-body {
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .obra-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }

    .obra-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .obra-meta {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-plus-cap {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 7px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-plus-cap:hover {
      border-color: var(--purple);
      background: var(--bg-card-hover);
    }

    .progress-bar {
      width: 100%;
      height: 5px;
      background: var(--bg-pill);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--purple-light));
    }

    .obra-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .obra-tag {
      font-size: 10px;
      background: var(--bg-pill);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .obra-actions {
      display: flex;
      gap: 4px;
      margin-top: auto;
      padding-top: 5px;
    }

    .obra-actions button,
    .obra-actions a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text-main);
      cursor: pointer;
    }

    .obra-actions .btn-del {
      color: #fca5a5;
    }

    body.theme-light .obra-actions .btn-del {
      color: #b91c1c;
    }

    /* Barra inferior de seleção em massa */
    .bulk-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 14px;
      background: var(--bg-card);
      border: 1px solid var(--purple);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 80;
    }

    .bulk-bar.active {
      display: flex;
    }

    .bulk-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .bulk-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bulk-actions button {
      flex: 1;
      min-width: 80px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .bulk-actions .btn-bulk-del {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    body.theme-light .bulk-actions .btn-bulk-del {
      color: #b91c1c;
    }

    /* Botão flutuante inferior direito */
    .fab-add {
      position: fixed;
      right: 16px;
      bottom: 24px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 24px var(--purple-glow);
      cursor: pointer;
      z-index: 45;
    }

    .fab-add.hidden-fab {
      display: none;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 28px;
    }

    /* Modais */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 5, 14, 0.84);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-card h2 {
      font-size: 17px;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .modal-card h3 {
      font-size: 13.5px;
      margin: 14px 0 8px;
      color: var(--text-main);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
    }

    .field textarea {
      min-height: 76px;
      resize: vertical;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cover-preview-box {
      width: 96px;
      height: 128px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: var(--bg-input);
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .cover-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .scan-row {
      display: grid;
      grid-template-columns: 1fr 1.3fr auto;
      gap: 6px;
      align-items: center;
    }

    .btn-small {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .cat-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cat-check-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: var(--text-main);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-footer button {
      flex: 1;
    }

    .settings-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .settings-tab {
      background: var(--bg-pill);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 7px 11px;
      fon
