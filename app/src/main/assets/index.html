<!DOCTYPE html>  <html lang="pt-BR">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <meta name="theme-color" content="#17151f">  
    <title>LARYVAS | Minha Biblioteca</title>  
    <link rel="stylesheet" href="style.css">  
</head>  
<body>  <header class="topo">  
    <h1>LARYVAS</h1>  
    <p>Sua biblioteca pessoal</p>  
</header>  

<main>  
    <section class="biblioteca">  
        <h2>Minha biblioteca</h2>  
        <p class="subtitulo">  
            Suas histórias, organizadas em um só lugar.  
        </p>  

        <div class="barra-pesquisa">  
            <input  
                type="search"  
                id="pesquisa"  
                placeholder="Pesquisar obras..."  
            >  
        </div>  

        <div id="lista-obras" class="grade-obras">  
            <div class="vazio">  
                <span>📚</span>  
                <h3>Sua estante está vazia</h3>  
                <p>Adicione sua primeira obra!</p>  
            </div>  
        </div>  

        <button id="adicionar-obra" class="botao-adicionar">  
            + Adicionar obra  
        </button>  
    </section>  
</main>  

<footer>  
    <p>LARYVAS © 2026</p>  
</footer>  

<script src="script.js"></script>

</body>  
</html>
