plugins { id 'com.android.application' }

android {
    namespace 'com.laryvas.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.laryvas.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '3.1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('LARYVAS_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('LARYVAS_STORE_PASSWORD')
                keyAlias System.getenv('LARYVAS_KEY_ALIAS')
                keyPassword System.getenv('LARYVAS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LARYVAS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
